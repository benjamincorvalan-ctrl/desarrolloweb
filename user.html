<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">                                      <!-- tildes y ñ -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- se adapta al celular -->
  <title>Perfil</title>                                       <!-- texto de la pestaña -->
  <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet"> <!-- tipografía de títulos -->
  <link rel="stylesheet" href="estilo.css">                   <!-- estilos compartidos -->
</head>
<body>
  <header class="cabecera"><h1>Perfil</h1></header>           <!-- título -->
  <section class="perfil">                                    <!-- tarjeta del usuario -->
    <img class="avatar" src="https://static.vecteezy.com/system/resources/previews/009/734/564/non_2x/default-avatar-profile-icon-of-social-media-user-vector.jpg" alt="Avatar"> <!-- foto redonda -->
    <h3 id="nombre">texto</h3>                                         <!-- nombre -->
  </section>
  <h2>Lista de favoritos</h2>                                 <!-- subtítulo -->
  <ol class="favoritos">                                      <!-- lista numerada -->
    <li>Película 1</li>
    <li>Película 2</li>
    <li>Película 3</li>
  </ol>
   <section class="login">                                   <!-- recuadro de sesión -->
      <h2 id="titulo-login">Inicia sesión</h2>                <!-- cambia a "Hola, nombre" al entrar -->
      <form id="formLogin">                                   <!-- formulario; JS captura el envío -->
        <input id="usuario" placeholder="Nombre de usuario" required> <!-- required = no se puede dejar vacío -->
        <input id="clave" type="password" placeholder="Contraseña" required> <!-- type=password oculta los puntos -->
        <button type="submit">Entrar</button>                 <!-- envía el formulario = iniciar sesión -->
        <button type="button" id="registrar">Crear cuenta</button> <!-- type=button no envía; lo maneja JS -->
      </form>
      <p id="mensaje"></p>                                    <!-- aquí JS escribe errores o éxito -->
      <button type="button" id="cuenta" hidden>Ver perfil</button>
      <button type="button" id="salir" hidden>Cerrar sesión</button> <!-- oculto hasta iniciar sesión -->
      <p><a href="user.html">Entrar como invitado</a></p>     <!-- acceso sin cuenta -->
    </section>
  <a class="volver" href="index.html">Volver a la página principal</a>
  <script src="user.js"></script>
</body>
</html>
