<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            background-color: #120203;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            }
            header{
                margin-bottom: 20px;
            }
            h1{
                font-family: 'Graduate', cursive, sans-serif;
                font-size: 2.2rem;
                margin-bottom: 10px;
                color: #ffffff;
            }
        .catalogo-grid{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap:25px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .tarjeta{
            display : flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 200px;
            min-width: 200px;
            text-decoration: none;
            color: white;
        }
        .tarjeta img{
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }
        .tarjeta.oculto{   /* Ocultar las tarjetas que ya fueron filtradas */
            display: none;
        }
        .mensaje-vacio{
            text-align: center;
            width: 100%;
            font-size: 1.2rem;
            color: #888;
            margin-top: 30px;
        }
        .boton-volver{
            display: inline-block;
            margin: 15px 20px;
            color: #ffc700;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .boton-volver:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="cabecera">
        <h1><img class="logo" src= "logo.png" alt = "Logo CineBit"> Películas épicas 777</h1>
        <p> Cátalogo de películas</p>
    </header>
    <a href = "index.html" class = "boton-volver"> Volver al inicio</a>

    <nav class = "barra" >
    <input type = "search" id = "inputBusqueda" placeholder="Buscar...">
    <select id = "selectGenero">
        <option value = "todos">Todos</option>
        <option value = "accion">Accion</option>
        <opcion value = "fantasia">Fantasia</opcion>
        <option value = "suspenso">Suspenso</option>
        <option value = "comedia">Comedia</option>
    </select>
    </nav>
    
    <main>
        <h2> Películas</h2>
        <div class = "catalogo-grid" id = "contenedorCatalogo">
            <a class = "tarjeta" href = "shrek.html" data-titulo="shrek" data-genero="fantasia comedia">
            <span>Shrek (2001)</span>
            </a>
            <a class = "tarjeta" href = "minion.html" data-titulo="minions nace un villano" data-genero="accion comedia">
            <span>Miions: Nace un villano (2022)</span>
            </a>
            <a class = "tarjeta" href = "salchicha.html" data-titulo="la fiesta de las salchichas" data-genero="comedia">
            <span>La fiesta de las salchichas</span>
            </a> 
        </div>
        <p id = "mensajeVacio" class = "mensaje-vacio" hidden> No hay coincidencias</p>
    </main>

    <footer>
        <a href = "about.html">Más información sobre la página</a>
        <p>Películas épicas 2026</p>
    </footer>

    <script>
        const inputBusqueda = document.getElementById("inputBusqueda");
        const selectGenero = document.getElementById("selectGenero");
        const tarjetas = document.querySelectorAll(".tarjeta");
        const mensajeVacio =document.getElementById("mensajeVacio");

        function filtrarCatalogo(){
            const texto = inputBusqueda.value.toLowerCase().trim();
            const genero = selectGenero.value.toLowerCase();
            let visibles = 0;
            tarjetas.forEach(tarjeta =>{
                const titulo = tarjeta.getAttribute("data-titulo") ? tarjeta.getAttribute("data-titulo").toLocaleLowerCase(): "";
                const generos = tarjeta.getAttribute("data-genero") ? tarjeta.getAttribute("data-genero").toLocaleLowerCase(): "";
                const coincideTexto = titulo.includes(texto);
                const coincideGenero = genero ==="todos" || generos.includes(genero);
                if(coincideTexto && coincideGenero){
                    tarjeta.classList.remove("oculto");
                    visibles++;
                }else{
                    tarjeta.classList.add("oculto");
                }
            }
            );
            mensajeVacio.hidden = visibles > 0;
        }
        inputBusqueda.addEventListener("input", filtrarCatalogo);
        selectGenero.addEventListener("change", filtrarCatalogo);
    </script>
</body>
</html>
