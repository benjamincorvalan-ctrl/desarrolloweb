<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">                                      <!-- tildes y ñ -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- se adapta al celular -->
  <title>La fiesta de las salchichas</title>                                           <!-- texto de la pestaña -->
  <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet"> <!-- tipografía de títulos -->
  <link rel="stylesheet" href="estilo.css">                   <!-- estilos compartidos -->
</head>
<body data-pelicula="salchicha">
  <header class="cabecera"><h1>La fiesta de las salchichas (2016)</h1></header>               <!-- título de la película -->
  <section class="ficha">                                     <!-- tarjeta con afiche y estrellas -->
    <img src="https://upload.wikimedia.org/wikipedia/en/f/f7/Sausage_Party_logo.png" alt="La fiesta de las salchichas"> <!-- afiche -->
    <p>Califica esta película:</p>
    <form class="star-rating">                                <!-- las estrellas se ordenan con CSS -->
      <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
      <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
      <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
      <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
      <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
    </form>
  </section>
  <section class="resenas">                                   <!-- tarjeta de reseñas -->
    <h2>Reseñas</h2>
    <form id="formResena" hidden>                             <!-- solo se muestra con sesión iniciada (lo decide resenas.js) -->
      <textarea name="texto" rows="4" maxlength="500" placeholder="Escribe tu reseña..." required></textarea> <!-- máx. 500 letras -->
      <button type="submit">Publicar reseña</button>
    </form>
    <p id="avisoResena">Inicia sesión para escribir una reseña. <a href="index.html">Ir a iniciar sesión</a></p> <!-- se muestra sin sesión -->
    <div id="listaResenas"></div>                             <!-- aquí aparecen las reseñas -->
  </section>
  <a class="volver" href="index.html">Volver a la página principal</a>
  <script src="resenas.js"></script>                         <!-- lógica de reseñas -->
</body>
</html>
