<!DOCTYPE html>                                              <!-- avisa que es un documento HTML5 -->
<html lang="es">                                              <!-- página en español -->
<head>                                                        <!-- datos invisibles de la página -->
  <meta charset="UTF-8">                                      <!-- para que se vean tildes y ñ -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- se adapta al celular -->
  <title>Películas épicas 777</title>                         <!-- texto de la pestaña -->
  <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet"> <!-- carga la tipografía de títulos -->
  <link rel="stylesheet" href="estilo.css">                  <!-- conecta el archivo CSS -->

  <style>
    .tarjeta.oculto{
      display: none !important;
    }
  </style>
</head>
<body>                                                        <!-- todo lo visible -->
  <header class="cabecera">                                   <!-- bloque del título (clase = nombre para el CSS) -->
    <h1><img class="logo" src="logo.png" alt="Logo CineBit">Películas épicas 777</h1> <!-- título principal con logo -->
    <p>Donde la magia del cine es mágica</p>                  <!-- eslogan -->
  </header>

  <nav class="barra">                                         <!-- barra de búsqueda y géneros -->
    <input type="search" id = "inputBusqueda" placeholder="Buscar película...">    <!-- campo de búsqueda -->
    <select id = "selectGenero">                                                  <!-- lista desplegable de géneros -->
      <option value = "todos">Todos los géneros</option>                      <!-- opción por defecto -->
      <optio value = "accion">Acción</option>                                 <!-- género -->
      <option value = "fantasia">Fantasía</option>                               <!-- género -->
      <option value = "suspenso">Suspenso</option>                               <!-- género -->
      <option value = "terror">Terror</option>                                 <!-- género -->
      <option value = "comedia"> Comedia</option>
    </select>
    <a href="catalogo.html">Catálogo de películas</a>         <!-- enlace al catálogo -->
  </nav>

  <main>                                                      <!-- contenido principal -->
    <h2>Películas populares de la semana</h2>                 <!-- subtítulo -->
    <div class="carrusel-caja">                               <!-- contiene flechas y carrusel -->
      <button class="flecha" id="izq">‹</button>              <!-- flecha izquierda (id para usarla en JS) -->
      <div class="carrusel" id="carrusel">                    <!-- lista horizontal -->
        <a class="tarjeta" href="shrek.html" data-titulo = "shrek" data-genero = "fantasia comedia">                 <!-- tarjeta: toda es un enlace a la ficha -->
          <img src="https://m.media-amazon.com/images/M/MV5BN2FkMTRkNTUtYTI0NC00ZjI4LWI5MzUtMDFmOGY0NmU2OGY1XkEyXkFqcGc@._V1_.jpg" alt="Shrek"> <!-- afiche -->
          <span>Shrek (2001)</span>                           <!-- título bajo el afiche -->
        </a>
        <a class="tarjeta" href="minion.html" data-titulo = "minions nace un villano" data-genero = "comedia accion">                <!-- segunda tarjeta -->
          <img src="https://m.media-amazon.com/images/I/81ffeOxg3gL._AC_UF1000,1000_QL80_.jpg" alt="Minions"> <!-- afiche -->
          <span>Minions: Nace un villano (2022)</span>        <!-- título -->
        </a>
        <a class="tarjeta" href="salchicha.html" data-titulo = "la fiesta de las salchichas" data-genero = "comedia">             <!-- tercera tarjeta -->
          <img src="https://upload.wikimedia.org/wikipedia/en/f/f7/Sausage_Party_logo.png" alt="La fiesta de las salchichas"> <!-- afiche -->
          <span>La fiesta de las salchichas (2016)</span>     <!-- título -->
        </a>                                                  <!-- para más películas, copia una tarjeta completa -->
      </div>
      <button class="flecha" id="der">›</button>              <!-- flecha derecha -->
    </div>

    <section class="login">                                   <!-- recuadro de sesión -->
      <h2 id="titulo-login">Inicia sesión</h2>                <!-- cambia a "Hola, nombre" al entrar -->
      <form id="formLogin">                                   <!-- formulario; JS captura el envío -->
        <input id="usuario" placeholder="Nombre de usuario" required> <!-- required = no se puede dejar vacío -->
        <input id="clave" type="password" placeholder="Contraseña" required> <!-- type=password oculta los puntos -->
        <button type="submit">Entrar</button>                 <!-- envía el formulario = iniciar sesión -->
        <button type="button" id="registrar">Crear cuenta</button> <!-- type=button no envía; lo maneja JS -->
      </form>
      <p id="mensaje"></p>                                    <!-- aquí JS escribe errores o éxito -->
      <button type="button" id="cuenta" hidden>Ver perfil</button>
      <button type="button" id="salir" hidden>Cerrar sesión</button> <!-- oculto hasta iniciar sesión -->
      <p><a href="user.html">Entrar como invitado</a></p>     <!-- acceso sin cuenta -->
    </section>
  </main>

  <footer>                                                    <!-- pie de página -->
    <a href="about.html">Más información sobre la página</a>  <!-- enlace a "Quiénes somos" -->
    <p>Películas épicas 2026</p>                              <!-- derechos -->
  </footer>

  <script src="todo.js"></script>
</body>
</html>
